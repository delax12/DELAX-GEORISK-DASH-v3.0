<style>

/* ═══════════════════════════════════════════════════════
   DESIGN SYSTEM v2.2 — CSS VARIABLES
   Change theme by toggling data-theme on <body>
   ═══════════════════════════════════════════════════════ */
:root {
  --bg-deep:#080c14; --bg-card:#0d1525; --bg-panel:#111d33;
  --border:#1e3055; --border-dim:#152238;
  --amber:#f5a623; --amber-dim:#c47e10;
  --cyan:#00d4ff; --cyan-dim:#0099cc;
  --green:#00e676; --red:#ff3d4a; --yellow:#ffe040; --purple:#b388ff;
  --text-pri:#e8edf5; --text-sec:#7a91b3; --text-dim:#7189ad; /* was #5a7299 = 3.96:1, failed AA; #7189ad = 5.42:1 */
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif; --display:'Bebas Neue',sans-serif;
  --font-scale:1; /* controlled by font-size slider */
}
/* OS-level "increase contrast": brighten the dimmest tiers and harden borders.
   Base palette already passes AA after the --text-dim fix above; this goes further
   for users who ask for it, and is invisible otherwise. */
@media (prefers-contrast: more) {
  :root {
    --text-sec:#9cb2d0; --text-dim:#9cb2d0;
    --border:#3a5578;
  }
}
/* Classic / light theme */
[data-theme="classic"] {
  --bg-deep:#f0f3f8; --bg-card:#fff; --bg-panel:#f7f9fc;
  --border:#d0d9e8; --border-dim:#e2e8f2;
  --amber:#c47e10; --amber-dim:#a06000; --cyan:#0070b8; --cyan-dim:#005a96;
  --green:#16803c; --red:#c41a27; --yellow:#b45309; --purple:#6d28d9;
  --text-pri:#0f1923; --text-sec:#374a63; --text-dim:#6b7fa0;
}
[data-theme="classic"] body::before{display:none}
[data-theme="classic"] .header{background:rgba(240,243,248,.97);border-bottom-color:#d0d9e8}
[data-theme="classic"] .kpi-card.up .kpi-value{color:#c41a27}
[data-theme="classic"] .kpi-card.down .kpi-value{color:#16803c}
/* Color-blind safe palette */
[data-colorblind="true"] { --green:#009E73; --red:#D55E00; --amber:#E69F00; --cyan:#56B4E9; --purple:#CC79A7; }

/* RESET */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(15px * var(--font-scale));scroll-behavior:smooth}
body{background:var(--bg-deep);color:var(--text-pri);font-family:var(--sans);line-height:1.5;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.015) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}

/* HEADER */
.header{position:sticky;top:0;z-index:200;background:rgba(8,12,20,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:60px;gap:.75rem;flex-wrap:wrap}
.header-brand{display:flex;align-items:baseline;gap:.6rem}
.logo{font-family:var(--display);font-size:1.4rem;letter-spacing:.08em;color:var(--amber);line-height:1}
.subtitle{font-family:var(--mono);font-size:.6rem;color:var(--text-sec);letter-spacing:.12em;text-transform:uppercase}
.header-meta{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.live-badge{display:flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.6rem;color:var(--green);letter-spacing:.1em;text-transform:uppercase}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 8px var(--green)}50%{opacity:.4;box-shadow:0 0 3px var(--green)}}
.timestamp{font-family:var(--mono);font-size:.6rem;color:var(--text-sec)}
.offline-badge{display:none;font-family:var(--mono);font-size:.58rem;color:var(--yellow);background:rgba(255,224,64,.12);border:1px solid rgba(255,224,64,.3);padding:.2rem .5rem;border-radius:2px}
.offline-badge.show{display:inline-flex}

/* BUTTONS */
.btn{background:transparent;border:1px solid var(--border);color:var(--text-sec);font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;padding:.38rem .8rem;border-radius:2px;cursor:pointer;transition:all .2s;white-space:nowrap;display:inline-flex;align-items:center;gap:.35rem}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.amber{border-color:var(--amber);color:var(--amber)}
.btn.amber:hover{background:var(--amber);color:#000;box-shadow:0 0 18px rgba(245,166,35,.4)}
.btn.cyan{border-color:var(--cyan);color:var(--cyan)}
.btn.cyan:hover{background:rgba(0,212,255,.15)}
.btn.green{border-color:var(--green);color:var(--green)}
.btn:disabled{opacity:.5;pointer-events:none}
.refresh-btn{background:transparent;border:1px solid var(--amber);color:var(--amber);font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;padding:.4rem .9rem;border-radius:2px;cursor:pointer;transition:all .2s}
.refresh-btn:hover{background:var(--amber);color:#000;box-shadow:0 0 18px rgba(245,166,35,.4)}
.refresh-btn:disabled{opacity:.5;pointer-events:none}

/* ALERT BANNER */
.alert-banner{background:linear-gradient(90deg,rgba(255,61,74,.1),rgba(255,61,74,.03));border:1px solid rgba(255,61,74,.3);border-left:3px solid var(--red);padding:.65rem 1.25rem;margin-bottom:0;border-radius:2px;display:flex;align-items:center;gap:1rem;font-family:var(--mono);font-size:.68rem;color:var(--text-sec)}
.alert-label{font-weight:600;letter-spacing:.1em;white-space:nowrap;flex-shrink:0}
.alert-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-text strong{color:var(--text-pri)}
@media(max-width:600px){.alert-text{white-space:normal}}

/* MAIN */
main{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding:1.25rem 1.25rem 4rem}

/* SECTION LABEL */
.section-label{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin-bottom:.9rem;display:flex;align-items:center;gap:.6rem}
.section-label::before{content:'';display:inline-block;width:16px;height:1px;background:var(--amber)}

/* MODE STRIP */
.mode-strip{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap}
.mode-badge{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;padding:.3rem .75rem;border-radius:2px;border:1px solid var(--border)}
.mode-badge.beginner{background:rgba(0,212,255,.1);border-color:var(--cyan);color:var(--cyan)}
.mode-badge.expert{background:rgba(179,136,255,.1);border-color:var(--purple);color:var(--purple)}

/* PROVENANCE ICON */
.info-icon{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:rgba(0,212,255,.15);border:1px solid var(--cyan-dim);color:var(--cyan);font-size:.55rem;cursor:help;flex-shrink:0;font-family:var(--mono);font-style:normal;vertical-align:middle;margin-left:.25rem}
.provenance-tip{position:fixed;z-index:9500;max-width:260px;background:var(--bg-panel);border:1px solid var(--border);border-left:3px solid var(--cyan);padding:.6rem .85rem;border-radius:2px;font-family:var(--mono);font-size:.6rem;color:var(--text-sec);line-height:1.6;box-shadow:0 8px 32px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .15s}
.provenance-tip.visible{opacity:1}

/* JARGON TOOLTIP */
[data-jargon]{border-bottom:1px dotted var(--text-dim);cursor:help}
.jargon-tip{position:fixed;z-index:9400;max-width:270px;background:var(--bg-panel);border:1px solid var(--border);border-left:3px solid var(--amber);padding:.6rem .85rem;border-radius:2px;font-family:var(--sans);font-size:.7rem;color:var(--text-sec);line-height:1.55;box-shadow:0 8px 32px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .15s}
.jargon-tip.visible{opacity:1}

/* TABS */
/* CONTROLS */
.controls-row{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap}
.control-group{display:flex;align-items:center;gap:.4rem}
.control-label{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
.toggle-btn{background:var(--bg-panel);border:1px solid var(--border);color:var(--text-sec);font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .75rem;border-radius:2px;cursor:pointer;transition:all .18s}
.toggle-btn.active-baseline{background:rgba(0,212,255,.15);border-color:var(--cyan);color:var(--cyan)}
.toggle-btn.active-optimistic{background:rgba(0,230,118,.12);border-color:var(--green);color:var(--green)}
.toggle-btn.active-pessimistic{background:rgba(255,61,74,.12);border-color:var(--red);color:var(--red)}
.toggle-btn:hover{border-color:var(--text-sec);color:var(--text-pri)}
.select-ctrl{background:var(--bg-panel);border:1px solid var(--border);color:var(--text-pri);font-family:var(--mono);font-size:.6rem;padding:.3rem .7rem;border-radius:2px;outline:none;cursor:pointer;appearance:none}
.select-ctrl:focus{border-color:var(--amber)}

/* CHART BOXES */
.chart-box{background:var(--bg-card);border:1px solid var(--border-dim);border-radius:2px;overflow:hidden;margin-bottom:1.1rem}
.chart-header{padding:.9rem 1.1rem .65rem;border-bottom:1px solid var(--border-dim);display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.chart-title{font-family:var(--display);font-size:1.1rem;letter-spacing:.06em;color:var(--text-pri)}
.chart-desc{font-family:var(--mono);font-size:.58rem;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase}
.chart-body{padding:.65rem .4rem .4rem}
.echart{width:100%}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;margin-bottom:1.1rem}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.1rem;margin-bottom:1.1rem}
@media(max-width:900px){.two-col,.three-col{grid-template-columns:1fr}}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:.22rem .55rem;border-radius:2px;font-weight:600}
.badge-buy{background:rgba(0,230,118,.15);color:var(--green);border:1px solid rgba(0,230,118,.4)}
.badge-avoid{background:rgba(255,61,74,.15);color:var(--red);border:1px solid rgba(255,61,74,.4)}
.badge-monitor{background:rgba(255,224,64,.12);color:var(--yellow);border:1px solid rgba(255,224,64,.3)}


/* ══ INSIGHTS ══ */
main{max-width:820px;margin:0 auto;padding:2rem 1.25rem 3rem}
@media(max-width:600px){main{padding:1.25rem .9rem 2.5rem}}

.ins-head{margin-bottom:2rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border-dim)}
.ins-head h1{font-family:var(--display);font-size:1.9rem;letter-spacing:.04em;color:var(--text-pri);margin-bottom:.5rem}
.ins-standfirst{font-family:var(--mono);font-size:.72rem;color:var(--text-sec);line-height:1.8;max-width:44rem}

.ins-list{display:flex;flex-direction:column;gap:0}
.ins-item{padding:1.1rem 0;border-bottom:1px solid var(--border-dim);display:block;text-decoration:none}
.ins-item:hover{text-decoration:none}
.ins-item:hover .ins-title{color:var(--amber)}
.ins-title{font-family:var(--display);font-size:1.15rem;letter-spacing:.02em;color:var(--text-pri);
  margin-bottom:.3rem;transition:color .15s;display:block}
.ins-meta{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-dim);margin-bottom:.4rem}
.ins-summary{font-family:var(--mono);font-size:.68rem;color:var(--text-sec);line-height:1.75}

.ins-empty{font-family:var(--mono);font-size:.68rem;color:var(--text-dim);line-height:1.9;
  padding:1.5rem;border:1px dashed var(--border);border-radius:2px;background:var(--bg-deep)}

/* ══ ARTICLE BODY ══ */
.ins-article h1{font-family:var(--display);font-size:1.75rem;letter-spacing:.03em;color:var(--text-pri);
  line-height:1.3;margin-bottom:.5rem}
.ins-body{font-family:var(--mono);font-size:.75rem;line-height:2;color:var(--text-sec);margin-top:1.5rem}
.ins-body h2{font-family:var(--display);font-size:1.2rem;color:var(--text-pri);
  letter-spacing:.03em;margin:2rem 0 .75rem}
.ins-body h3{font-family:var(--display);font-size:1rem;color:var(--text-pri);margin:1.5rem 0 .6rem}
.ins-body h4,.ins-body h5{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-dim);margin:1.4rem 0 .5rem}
.ins-body p{margin-bottom:1.1rem}
.ins-body ul{margin:0 0 1.1rem 1.1rem}
.ins-body li{margin-bottom:.45rem;list-style:disc}
.ins-body code{background:var(--bg-deep);border:1px solid var(--border-dim);
  padding:.1rem .35rem;border-radius:2px;font-size:.92em;color:var(--amber)}
.ins-body strong{color:var(--text-pri);font-weight:700}
.ins-body a{color:var(--cyan)}
.ins-back{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-dim);display:inline-block;margin-bottom:1.25rem}
.ins-back:hover{color:var(--cyan)}

</style>
</head>
<body data-theme="cyberpunk">

<div id="dxHeader"></div>

<main>
  <!-- INDEX VIEW -->
  <section id="insIndex">
    <div class="ins-head">
      <h1>Insights</h1>
      <!-- Default copy below is what renders when the CMS is unreachable. The
           slot only OVERRIDES it; it never supplies it. -->
      <p class="ins-standfirst" data-cms-slot="insights.intro">Notes on method, structure and evidence from the DELAX GEO-RISK desk.</p>
    </div>
    <div class="ins-list" id="insList">
      <div class="ins-empty">Loading…</div>
    </div>
  </section>

  <!-- ARTICLE VIEW -->
  <article class="ins-article" id="insArticle" style="display:none">
    <a class="ins-back" href="/insights.html">&larr; All insights</a>
    <h1 id="insTitle"></h1>
    <div class="ins-meta" id="insMeta"></div>
    <div class="ins-body" id="insBody"></div>
  </article>
</main>

<div id="dxFooter"></div>

<script>
/* Insights: one page serving both the index and a single article, selected by
   ?slug=. Two URLs, one file — a separate template per view would be a second
   place to forget a change. */
document.addEventListener('DOMContentLoaded', function () {
  if (window.DelaxChrome) DelaxChrome.render({ page: 'Insights', active: 'insights' });

  /* The content layer itself may be missing — blocked, cached badly, or simply
     failed to load. That is the one failure delax-cms.js cannot handle on its
     own, so the page handles it: show the same honest empty state rather than
     leaving "Loading…" on screen forever. */
  if (!window.DelaxCMS) { emptyState(); return; }

  var slug = null;
  try { slug = new URLSearchParams(location.search).get('slug'); } catch (e) {}

  if (slug) { showArticle(slug); } else { showIndex(); }
});

function emptyState(text) {
  var list = document.getElementById('insList');
  if (list) {
    list.innerHTML = '<div class="ins-empty">' + (text ||
      'No insights published yet. Method and model documentation is available on the ' +
      '<a href="/methodology.html" style="color:var(--cyan)">methodology page</a>.') + '</div>';
  }
}

async function showIndex() {
  var list = document.getElementById('insList');
  var items = await DelaxCMS.listArticles(30);

  if (!items.length) {
    /* No published articles, or the database is unreachable. Both say the same
       honest thing rather than an error the reader can do nothing about. */
    emptyState();
    return;
  }

  list.innerHTML = items.map(function (a) {
    var meta = [DelaxCMS.formatDate(a.published_at), a.author_email ? 'DELAX Desk' : '']
      .filter(Boolean).join(' · ');
    return '<a class="ins-item" href="/insights.html?slug=' + encodeURIComponent(a.slug) + '">' +
      (meta ? '<div class="ins-meta">' + DelaxCMS.escapeHtml(meta) + '</div>' : '') +
      '<span class="ins-title">' + DelaxCMS.escapeHtml(a.title) + '</span>' +
      (a.summary ? '<div class="ins-summary">' + DelaxCMS.escapeHtml(a.summary) + '</div>' : '') +
    '</a>';
  }).join('');
}

async function showArticle(slug) {
  var a = await DelaxCMS.getArticle(slug);

  if (!a) {
    document.getElementById('insIndex').style.display = '';
    emptyState('That article is not available. It may have been unpublished, ' +
               'or the address may be wrong.');
    return;
  }

  document.getElementById('insIndex').style.display = 'none';
  var art = document.getElementById('insArticle');
  art.style.display = '';

  document.title = a.title + ' — DELAX GEO-RISK';
  document.getElementById('insTitle').textContent = a.title;
  document.getElementById('insMeta').textContent = DelaxCMS.formatDate(a.published_at);
  /* renderMarkdown escapes all input before applying formatting, so an editor
     cannot inject markup into a public page. Verified against a parsed DOM. */
  document.getElementById('insBody').innerHTML = DelaxCMS.renderMarkdown(a.body);
}
</script>
</body>
